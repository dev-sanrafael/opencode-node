name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify .js syntax (node --check)
        run: |
          for f in opencode-server.js opencode-cli.js; do
            node --check "$f"
            echo "OK: $f"
          done
